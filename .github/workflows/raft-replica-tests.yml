name: Raft Replica Tests

on:
  push:
    branches:
      - main
      - fix/raft-log-consistency
  pull_request:
    branches:
      - main

jobs:
  replica-tests:
    runs-on: ubuntu-latest
    env:
      PORT: 8081
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run replica unit and application tests
        run: mvn -B -f replica/pom.xml test
